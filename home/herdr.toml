onboarding = false

[keys]
# Split the current pane to the right with prefix + |
split_vertical = "prefix+|"
# Split the current pane downward with prefix + -
split_horizontal = "prefix+minus"

[ui]
status_indicators = "symbols"
copy_on_select = true

[ui.toast]
delivery = "system"

[terminal]
# Default since 0.9.0; written out because yazi image previews rely on it.
kitty_graphics = true

[theme]
# Vesper greys, with every panel forced to pure black.
name = "vesper"
auto_switch = false

[theme.custom]
panel_bg = "#000000"
sidebar_bg = "#000000"
surface_dim = "#000000"
active_row_bg = "#121212"
selection_bg = "#1c1c1c"
surface0 = "#1c1c1c"
surface1 = "#2a2a2a"
